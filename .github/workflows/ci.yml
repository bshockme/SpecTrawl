name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev libxkbcommon-dev libwayland-dev libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy -p sdr-core -p backend-sim -p backend-airspy -p dsp -p api -p engine -p spectrawl-app --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: pwsh tools/fetch_captures.ps1
        env: { GH_TOKEN: "${{ github.token }}" }
      - if: runner.os == 'Linux'
        run: sh tools/fetch_captures.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: cargo test --workspace
