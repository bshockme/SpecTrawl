[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
api = { path = "../api", features = ["serde"] }
arc-swap = "1.7"
cpal = "0.15.3"
dsp = { version = "0.1.0", path = "../dsp" }
log = "0.4"
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
sdr-core = { version = "0.1.0", path = "../sdr-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
backend-airspy = { path = "../backend-airspy" }
backend-sim = { path = "../backend-sim" }
serde_json = "1"
