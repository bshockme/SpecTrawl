[package]
name = "onair-rx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Drives OnAir's onair-server (GPL-3, a separate program) as a SpecTrawl decoder worker: process supervisor and protocol client only."

[dependencies]
api = { path = "../api" }
engine = { path = "../engine" }
log = "0.4"
serde_json = "1"

[dev-dependencies]
backend-airspy = { path = "../backend-airspy" }
backend-sim = { path = "../backend-sim" }
sdr-core = { path = "../sdr-core" }
